databases:
  - name: scout-db
    plan: basic-256mb
    databaseName: scout_context
    user: scout_context

services:
  - type: web
    name: kynticai-scout-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./src/KynticAI.Scout.Api/Dockerfile
    plan: starter
    healthCheckPath: /health/ready
    preDeployCommand: dotnet KynticAI.Scout.Api.dll migrate
    disk:
      name: scout-data-protection
      mountPath: /var/lib/scout/data-protection-keys
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Platform__Mode
        value: SelfHosted
      - key: Database__Provider
        value: Postgres
      - key: Bootstrap__ApplyMigrationsOnStartup
        value: "false"
      - key: Bootstrap__SeedDemoData
        value: "false"
      - key: ConnectionStrings__Scout
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: Auth__Issuer
        value: Scout
      - key: Auth__Audience
        value: KynticAI.Scout.Api
      - key: Auth__SigningKey
        sync: false
      - key: ReferenceData__CustomerOpsEnabled
        value: "false"
      - key: FeatureFlags__SaaSControlPlane
        value: "false"
      - key: FeatureFlags__HostedBillingUsage
        value: "false"
      - key: ContextPackages__LowConfidenceThreshold
        value: "0.75"
      - key: ContextPackages__MinimumStrongFacts
        value: "3"
      - key: Cors__AllowedOrigins__0
        value: https://kynticai-scout-web.onrender.com
      - key: SaaS__PublicBaseUrl
        value: https://kynticai-scout-api.onrender.com
      - key: Telemetry__DeploymentEnvironment
        value: production
      - key: Telemetry__OtlpEndpoint
        sync: false
      - key: RateLimits__AuthPermitLimit
        value: "5"
      - key: RateLimits__AuthWindowSeconds
        value: "60"
      - key: RateLimits__GraphQlTokenLimit
        value: "120"
      - key: RateLimits__GraphQlTokensPerPeriod
        value: "120"
      - key: RateLimits__GraphQlReplenishmentSeconds
        value: "60"

  - type: web
    name: kynticai-scout-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kynticai-scout-api.onrender.com
      - key: VITE_GRAPHQL_ENDPOINT
        value: https://kynticai-scout-api.onrender.com/graphql
      - key: VITE_DEMO_FALLBACK
        value: "false"
